name: Deploy site (with live data refresh)
on:
  push: {branches: [main]}
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pipeline dependencies
        run: pip install -r requirements.txt
      - name: Fetch live data
        run: python scripts/fetch_open_data.py
        continue-on-error: true
      - name: Train hazard model and rebuild the map
        run: python scripts/build_hazard.py
      - name: Rank habitations and assign relocation sites
        run: python scripts/plan_relocation.py
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: web}
      - id: d
        uses: actions/deploy-pages@v4
